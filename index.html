    <script>
        // EXACT QUESTIONS FROM IMAGE + FULL STEP-BY-STEP ANSWERS FROM PDF
        const examData = [
            // Q1-A: Conjugates
            {
                id: "1A", header: "السؤال الأول / أ",
                question: "إذا كان $\\frac{3-2i}{i}$ و $\\frac{x-yi}{1+5i}$ مترافقان، جد $x, y \\in R$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>أولاً: نبسط الكسر الأول بضرب البسط والمقام في $-i$:</p>
                        $$ \\frac{3-2i}{i} \\times \\frac{-i}{-i} = \\frac{-3i + 2i^2}{-i^2} = \\frac{-2-3i}{1} = -2-3i $$
                        <p>ثانياً: نبسط الكسر الثاني بضرب البسط والمقام في المرافق $(1-5i)$:</p>
                        $$ \\frac{x-yi}{1+5i} \\times \\frac{1-5i}{1-5i} = \\frac{x - 5xi - yi + 5yi^2}{1^2 + 5^2} = \\frac{(x-5y) - i(5x+y)}{26} $$
                        <p>بما أن العددين مترافقان، فإن الجزء الحقيقي للعدد الأول يساوي الجزء الحقيقي للعدد الثاني، والجزء التخيلي للعدد الأول يساوي سالب الجزء التخيلي للعدد الثاني (أو العكس حسب تعريف الترافق):</p>
                        <p>المرافق لـ $(-2-3i)$ هو $(-2+3i)$.</p>
                        <p>بالمساواة:</p>
                        $$ \\frac{x-5y}{26} = -2 \\Rightarrow x-5y = -52 \quad ...(1) $$
                        $$ \\frac{-(5x+y)}{26} = 3 \\Rightarrow -(5x+y) = 78 \\Rightarrow 5x+y = -78 \quad ...(2) $$
                        <p>بحل المعادلتين (1) و (2) آنياً:</p>
                        <p>من (2): $y = -78 - 5x$. نعوض في (1):</p>
                        $$ x - 5(-78-5x) = -52 \\Rightarrow x + 390 + 25x = -52 \\Rightarrow 26x = -442 \\Rightarrow x = -17 $$
                        $$ y = -78 - 5(-17) = -78 + 85 = 7 $$
                        <p><em>(ملاحظة: ورد في بعض نماذج الإجابة قيم مختلفة بناءً على إشارة الترافق، ولكن الحساب المباشر أعلاه هو الأصح رياضياً للنص المذكور).</em></p>
                    </div>
                    <div class="final-result">الإجابة: $x = -17, y = 7$</div>
                `
            },
            // Q1-B: Area (FIXED with full PDF steps)
            {
                id: "1B", header: "السؤال الأول / ب",
                question: "جد المساحة المحددة بالدالتين: $y = x^2$ و $y = x^4 - 12$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>١. نوجد نقاط التقاطع بمساواة الدالتين:</p>
                        $$ x^2 = x^4 - 12 \\Rightarrow x^4 - x^2 - 12 = 0 $$
                        <p>نحل المعادلة كعادلة تربيعية في $x^2$:</p>
                        $$ (x^2 - 4)(x^2 + 3) = 0 $$
                        <p>الحل الحقيقي هو $x^2 = 4 \\Rightarrow x = \\pm 2$.</p>
                        <p>٢. نحدد الدالة العليا والدالة السفلى في الفترة $[-2, 2]$:</p>
                        <p>عند $x=0$: $y=x^2=0$ و $y=x^4-12=-12$. إذن $y=x^2$ هي العليا.</p>
                        <p>٣. نحسب المساحة بالتكامل:</p>
                        $$ A = \\int_{-2}^{2} [x^2 - (x^4 - 12)] dx = \\int_{-2}^{2} (x^2 - x^4 + 12) dx $$
                        <p>بما أن الدالة زوجية، يمكننا التكامل من 0 إلى 2 والضرب في 2:</p>
                        $$ A = 2 \\int_{0}^{2} (x^2 - x^4 + 12) dx $$
                        $$ = 2 \\left[ \\frac{x^3}{3} - \\frac{x^5}{5} + 12x \\right]_0^2 $$
                        $$ = 2 \\left( (\\frac{8}{3} - \\frac{32}{5} + 24) - 0 \\right) $$
                        $$ = 2 \\left( \\frac{40 - 96 + 360}{15} \\right) = 2 \\left( \\frac{304}{15} \\right) = \\frac{608}{15} $$
                    </div>
                    <div class="diagram-box">
                        <svg width="300" height="200" viewBox="-3 -15 6 20">
                            <path d="M -2.5 6 Q 0 -12 2.5 6" stroke="#e74c3c" fill="none" stroke-width="0.1"/>
                            <path d="M -2.5 6 Q 0 0 2.5 6" stroke="#2980b9" fill="none" stroke-width="0.1"/>
                            <line x1="-3" y1="0" x2="3" y2="0" stroke="#333" stroke-width="0.05"/>
                            <line x1="0" y1="-15" x2="0" y2="5" stroke="#333" stroke-width="0.05"/>
                            <text x="0.2" y="-1" font-size="0.8">Area</text>
                        </svg>
                        <div class="diagram-caption">المنطقة المحصورة بين القطع المكافئ والمنحنى الرباعي</div>
                    </div>
                    <div class="final-result">الإجابة: $\\frac{608}{15}$ وحدة مربعة</div>
                `
            },
            // Q2-A: Related Rates
            {
                id: "2A", header: "السؤال الثاني / أ",
                question: "متوازي سطوح مستطيلة قاعدته مربعة الشكل يزداد طول ضلع قاعدته بمعدل $(0.5 \\text{ cm/s})$ بحيث يبقى الحجم ثابت يساوي $(48 \\text{ cm}^3)$، وفي اللحظة التي يكون فيها الارتفاع $(3 \\text{ cm})$ جد معدل التغير في الإرتفاع.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>ليكن $x$ طول ضلع القاعدة المربعة و $h$ الارتفاع.</p>
                        <p>الحجم $V = x^2 h = 48$ (ثابت).</p>
                        <p>عند اللحظة المطلوبة: $h = 3 \\Rightarrow x^2(3) = 48 \\Rightarrow x^2 = 16 \\Rightarrow x = 4$.</p>
                        <p>المعطى: $\\frac{dx}{dt} = 0.5$.</p>
                        <p>نشتق معادلة الحجم بالنسبة للزمن $t$:</p>
                        $$ \\frac{dV}{dt} = 2xh \\frac{dx}{dt} + x^2 \\frac{dh}{dt} $$
                        <p>بما أن الحجم ثابت، فإن $\\frac{dV}{dt} = 0$:</p>
                        $$ 0 = 2(4)(3)(0.5) + (4)^2 \\frac{dh}{dt} $$
                        $$ 0 = 12 + 16 \\frac{dh}{dt} $$
                        $$ 16 \\frac{dh}{dt} = -12 \\Rightarrow \\frac{dh}{dt} = -\\frac{12}{16} = -0.75 $$
                    </div>
                    <div class="final-result">الإجابة: $-0.75 \\text{ cm/s}$ (يتناقص الارتفاع)</div>
                `
            },
            // Q2-B-1: Integral 1
            {
                id: "2B1", header: "السؤال الثاني / ب-١",
                question: "جد التكامل: $\\int (\\sqrt{x} + x \\sec^2 x^2) \\, dx$",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نجزئ التكامل إلى حدين:</p>
                        $$ I = \\int x^{1/2} dx + \\int x \\sec^2(x^2) dx $$
                        <p>الحد الأول (قاعدة القوة):</p>
                        $$ \\int x^{1/2} dx = \\frac{x^{3/2}}{3/2} = \\frac{2}{3}x^{3/2} $$
                        <p>الحد الثاني (التعويض):</p>
                        <p>نفرض $u = x^2 \\Rightarrow du = 2x dx \\Rightarrow x dx = \\frac{1}{2} du$</p>
                        $$ \\int \\sec^2(u) \\cdot \\frac{1}{2} du = \\frac{1}{2} \\tan(u) = \\frac{1}{2} \\tan(x^2) $$
                        <p>نجمع الناتجين:</p>
                    </div>
                    <div class="final-result">الإجابة: $\\frac{2}{3}x^{3/2} + \\frac{1}{2}\\tan(x^2) + C$</div>
                `
            },
            // Q2-B-2: Integral 2
            {
                id: "2B2", header: "السؤال الثاني / ب-٢",
                question: "جد التكامل: $\\int \\sin 6x \\cos^2 3x \\, dx$",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نستخدم متطابقة ضعف الزاوية: $\\sin 6x = 2 \\sin 3x \\cos 3x$</p>
                        $$ \\int (2 \\sin 3x \\cos 3x) \\cos^2 3x \\, dx = 2 \\int \\sin 3x \\cos^3 3x \\, dx $$
                        <p>نفرض $u = \\cos 3x \\Rightarrow du = -3 \\sin 3x dx \\Rightarrow \\sin 3x dx = -\\frac{1}{3} du$</p>
                        $$ 2 \\int u^3 (-\\frac{1}{3}) du = -\\frac{2}{3} \\int u^3 du $$
                        $$ = -\\frac{2}{3} \\cdot \\frac{u^4}{4} = -\\frac{1}{6} u^4 $$
                        <p>نرجع للمتغير الأصلي:</p>
                    </div>
                    <div class="final-result">الإجابة: $-\\frac{1}{6}\\cos^4 3x + C$</div>
                `
            },
            // Q2-B-3: Integral 3
            {
                id: "2B3", header: "السؤال الثاني / ب-٣",
                question: "جد التكامل: $\\int_0^{\\ln 2} e^{-x} \\, dx$",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>تكامل $e^{-x}$ هو $-e^{-x}$:</p>
                        $$ [-e^{-x}]_0^{\\ln 2} $$
                        <p>نعوض بالحدود:</p>
                        $$ (-e^{-\\ln 2}) - (-e^0) $$
                        $$ = (-\\frac{1}{e^{\\ln 2}}) - (-1) $$
                        $$ = -\\frac{1}{2} + 1 = \\frac{1}{2} $$
                    </div>
                    <div class="final-result">الإجابة: $0.5$</div>
                `
            },
            // Q3-A1: Convex Function
            {
                id: "3A1", header: "السؤال الثالث / أ-١",
                question: "إذا علمت أن: $f(x) = ax^2 - 6x + b$ حيث $b \\in R$ ، $a \\in \\{-4, 8\\}$، جد قيمة $a$ إذا كانت الدالة $f$ محدبة.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>الدالة محدبة (Convex) إذا كانت المشتقة الثانية موجبة ($f''(x) > 0$).</p>
                        $$ f'(x) = 2ax - 6 $$
                        $$ f''(x) = 2a $$
                        <p>لكي تكون محدبة: $2a > 0 \\Rightarrow a > 0$.</p>
                        <p>من المجموعة المعطاة $\\{-4, 8\\}$، القيمة الموجبة الوحيدة هي $8$.</p>
                    </div>
                    <div class="final-result">الإجابة: $a = 8$</div>
                `
            },
            // Q3-A2: Definite Integral Constant
            {
                id: "3A2", header: "السؤال الثالث / أ-٢",
                question: "جد $a \\in R$ إذا علمت أن: $\\int_a^4 \\frac{x}{\\sqrt{x^2+9}} \\, dx = 2$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نحسب التكامل بالتعويض $u = x^2+9 \\Rightarrow du = 2x dx$:</p>
                        $$ \\int \\frac{x}{\\sqrt{x^2+9}} dx = \\sqrt{x^2+9} $$
                        <p>نعوض بالحدود:</p>
                        $$ [\\sqrt{x^2+9}]_a^4 = 2 $$
                        $$ \\sqrt{4^2+9} - \\sqrt{a^2+9} = 2 $$
                        $$ \\sqrt{25} - \\sqrt{a^2+9} = 2 $$
                        $$ 5 - \\sqrt{a^2+9} = 2 \\Rightarrow \\sqrt{a^2+9} = 3 $$
                        <p>بتربيع الطرفين:</p>
                        $$ a^2 + 9 = 9 \\Rightarrow a^2 = 0 \\Rightarrow a = 0 $$
                    </div>
                    <div class="final-result">الإجابة: $a = 0$</div>
                `
            },
            // Q3-B: Differential Equation
            {
                id: "3B", header: "السؤال الثالث / ب",
                question: "جد الحل العام للمعادلة التفاضلية: $e^{x+2y} + y' = 0$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نفصل المتغيرات باستخدام خصائص الأسس $e^{x+2y} = e^x \\cdot e^{2y}$:</p>
                        $$ e^x e^{2y} + \\frac{dy}{dx} = 0 \\Rightarrow \\frac{dy}{dx} = -e^x e^{2y} $$
                        $$ e^{-2y} dy = -e^x dx $$
                        <p>نكامل الطرفين:</p>
                        $$ \\int e^{-2y} dy = -\\int e^x dx $$
                        $$ -\\frac{1}{2}e^{-2y} = -e^x + C_1 $$
                        <p>نضرب في $-2$ لتبسيط الثابت:</p>
                        $$ e^{-2y} = 2e^x + C $$
                    </div>
                    <div class="final-result">الإجابة: $e^{-2y} = 2e^x + C$</div>
                `
            },
            // Q4-A: Ellipse & Parabola
            {
                id: "4A", header: "السؤال الرابع / أ",
                question: "جد معادلة القطع الناقص الذي بؤرتاه تنتميان إلى محور السينات ومركزه نقطة الأصل، طول محوره الصغير يساوي نصف طول محوره الكبير والذي يقطع القطع المكافئ $y^2 + 8x = 0$ عند النقطة التي إحداثيها الصادي يساوي $(4)$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>١. نجد نقطة التقاطع مع القطع المكافئ $y^2 + 8x = 0$ عند $y=4$:</p>
                        $$ (4)^2 + 8x = 0 \\Rightarrow 16 + 8x = 0 \\Rightarrow x = -2 $$
                        <p>النقطة هي $(-2, 4)$.</p>
                        <p>٢. بما أن القطع الناقص يمر بهذه النقطة (حسب نص السؤال الضمني للعلاقة الهندسية)، وبؤرتاه على محور السينات، فمعادلته:</p>
                        $$ \\frac{x^2}{a^2} + \\frac{y^2}{b^2} = 1 $$
                        <p>٣. العلاقة المعطاة: طول المحور الصغير = نصف طول المحور الكبير:</p>
                        $$ 2b = \\frac{1}{2}(2a) \\Rightarrow 2b = a \\Rightarrow a^2 = 4b^2 $$
                        <p>٤. نعوض بالنقطة $(-2, 4)$ والعلاقة $a^2=4b^2$ في المعادلة:</p>
                        $$ \\frac{(-2)^2}{4b^2} + \\frac{(4)^2}{b^2} = 1 $$
                        $$ \\frac{4}{4b^2} + \\frac{16}{b^2} = 1 \\Rightarrow \\frac{1}{b^2} + \\frac{16}{b^2} = 1 $$
                        $$ \\frac{17}{b^2} = 1 \\Rightarrow b^2 = 17 $$
                        $$ a^2 = 4(17) = 68 $$
                    </div>
                    <div class="diagram-box">
                        <svg width="300" height="200" viewBox="-10 -6 12 12">
                            <ellipse cx="0" cy="0" rx="8.2" ry="4.1" stroke="#2980b9" fill="none" stroke-width="0.1"/>
                            <path d="M 0 0 Q -5 -5 -10 0" stroke="#e74c3c" fill="none" stroke-width="0.1"/>
                            <circle cx="-2" cy="4" r="0.2" fill="green"/>
                            <text x="-1.5" y="4.5" font-size="0.8">(-2,4)</text>
                            <line x1="-10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="0.05"/>
                            <line x1="0" y1="-6" x2="0" y2="6" stroke="#333" stroke-width="0.05"/>
                        </svg>
                        <div class="diagram-caption">القطع الناقص والقطع المكافئ ونقطة التقاطع</div>
                    </div>
                    <div class="final-result">الإجابة: $\\frac{x^2}{68} + \\frac{y^2}{17} = 1$</div>
                `
            },
            // Q4-B: Complex Proof
            {
                id: "4B", header: "السؤال الرابع / ب",
                question: "إثبت أن: $(5 - \\frac{5}{1+\\omega^2} - \\frac{3}{1+\\omega})^6 = 64$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الإثبات:</h3>
                        <p>من خصائص جذر الوحدة التكعيبي: $1+\\omega+\\omega^2=0$.</p>
                        <p>إذن: $1+\\omega^2 = -\\omega$ و $1+\\omega = -\\omega^2$.</p>
                        <p>نعوض في المقدار داخل القوس:</p>
                        $$ 5 - \\frac{5}{-\\omega} - \\frac{3}{-\\omega^2} = 5 + \\frac{5}{\\omega} + \\frac{3}{\\omega^2} $$
                        <p>نوحد المقامات أو نستخدم خاصية $\\frac{1}{\\omega}=\\omega^2$ و $\\frac{1}{\\omega^2}=\\omega$:</p>
                        $$ = 5 + 5\\omega^2 + 3\\omega $$
                        <p>نأخذ 5 عاملاً مشتركاً من أول حدين:</p>
                        $$ = 5(1+\\omega^2) + 3\\omega $$
                        <p>بما أن $1+\\omega^2 = -\\omega$:</p>
                        $$ = 5(-\\omega) + 3\\omega = -5\\omega + 3\\omega = -2\\omega $$
                        <p>الآن نرفع الناتج للقوة ٦:</p>
                        $$ (-2\\omega)^6 = (-2)^6 \\cdot \\omega^6 = 64 \\cdot (\\omega^3)^2 $$
                        <p>بما أن $\\omega^3 = 1$:</p>
                        $$ = 64 \\cdot (1)^2 = 64 $$
                    </div>
                    <div class="final-result">تم الإثبات: الطرف الأيمن = ٦٤</div>
                `
            },
            // Q4-C: Optimization Proof
            {
                id: "4C", header: "السؤال الرابع / ج",
                question: "مجموع محيطي دائرة ومربع يساوي $(60 \\text{ cm})$، إثبت أنه عندما يكون مجموع مساحتي الشكلين أصغر ما يمكن فإن طول قطر الدائرة يساوي طول ضلع المربع.",
                solution: `
                    <div class="step">
                        <h3>خطوات الإثبات:</h3>
                        <p>ليكن $r$ نصف قطر الدائرة و $s$ ضلع المربع.</p>
                        <p>محيط الدائرة $= 2\\pi r$ ، محيط المربع $= 4s$.</p>
                        <p>الشرط: $2\\pi r + 4s = 60 \\Rightarrow \\pi r + 2s = 30 \\Rightarrow s = \\frac{30 - \\pi r}{2}$.</p>
                        <p>مساحة الدائرة $= \\pi r^2$ ، مساحة المربع $= s^2$.</p>
                        <p>دالة المساحة الكلية $A(r)$:</p>
                        $$ A = \\pi r^2 + (\\frac{30 - \\pi r}{2})^2 $$
                        <p>نشتق بالنسبة لـ $r$ ونساوي بالصفر للقيمة الصغرى:</p>
                        $$ \\frac{dA}{dr} = 2\\pi r + 2(\\frac{30 - \\pi r}{2})(-\\frac{\\pi}{2}) = 0 $$
                        $$ 2\\pi r - \\frac{\\pi}{2}(30 - \\pi r) = 0 $$
                        <p>نقسم على $\\pi$:</p>
                        $$ 2r - \\frac{1}{2}(30 - \\pi r) = 0 \\Rightarrow 4r - (30 - \\pi r) = 0 $$
                        $$ 4r + \\pi r = 30 \\Rightarrow r(4+\\pi) = 30 $$
                        <p>من شرط المحيط الأصلي: $2\\pi r + 4s = 60 \\Rightarrow \\pi r + 2s = 30$.</p>
                        <p>بمقارنة $r(4+\\pi)=30$ مع $\\pi r + 2s = 30$:</p>
                        $$ 4r + \\pi r = \\pi r + 2s \\Rightarrow 4r = 2s \\Rightarrow 2r = s $$
                        <p>بما أن $2r$ هو قطر الدائرة و $s$ هو ضلع المربع:</p>
                    </div>
                    <div class="diagram-box">
                        <svg width="200" height="100" viewBox="0 0 200 100">
                            <rect x="10" y="20" width="60" height="60" stroke="#2980b9" fill="none" stroke-width="2"/>
                            <circle cx="140" cy="50" r="30" stroke="#e74c3c" fill="none" stroke-width="2"/>
                            <text x="40" y="95" text-anchor="middle" font-size="12">s</text>
                            <text x="140" y="95" text-anchor="middle" font-size="12">2r</text>
                        </svg>
                        <div class="diagram-caption">عند القيمة الصغرى: القطر = الضلع</div>
                    </div>
                    <div class="final-result">تم الإثبات: قطر الدائرة = ضلع المربع</div>
                `
            },
            // Q5-A: De Moivre
            {
                id: "5A", header: "السؤال الخامس / أ",
                question: "جد باستخدام مبرهنة ديموافر أو التعميم: $(2\\sqrt{3} + \\sqrt{-4})^{-2}$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نبسط العدد المركب: $z = 2\\sqrt{3} + 2i$.</p>
                        <p>نحسب المقياس $r$ والسعة $\\theta$:</p>
                        $$ r = \\sqrt{(2\\sqrt{3})^2 + (2)^2} = \\sqrt{12+4} = \\sqrt{16} = 4 $$
                        $$ \\tan \\theta = \\frac{2}{2\\sqrt{3}} = \\frac{1}{\\sqrt{3}} \\Rightarrow \\theta = \\frac{\\pi}{6} $$
                        <p>الشكل القطبي: $z = 4(\\cos \\frac{\\pi}{6} + i \\sin \\frac{\\pi}{6})$.</p>
                        <p>بتطبيق مبرهنة ديموافر للأس السالب $-2$:</p>
                        $$ z^{-2} = 4^{-2} [\\cos(-2 \\cdot \\frac{\\pi}{6}) + i \\sin(-2 \\cdot \\frac{\\pi}{6})] $$
                        $$ = \\frac{1}{16} [\\cos(-\\frac{\\pi}{3}) + i \\sin(-\\frac{\\pi}{3})] $$
                        $$ = \\frac{1}{16} [\\frac{1}{2} - i\\frac{\\sqrt{3}}{2}] $$
                        $$ = \\frac{1}{32} - i\\frac{\\sqrt{3}}{32} $$
                    </div>
                    <div class="diagram-box">
                        <svg width="200" height="150" viewBox="-1 -1 5 4">
                            <line x1="0" y1="0" x2="4" y2="0" stroke="#333" stroke-width="0.05"/>
                            <line x1="0" y1="0" x2="0" y2="3" stroke="#333" stroke-width="0.05"/>
                            <line x1="0" y1="0" x2="3.46" y2="2" stroke="#2980b9" stroke-width="0.1"/>
                            <circle cx="3.46" cy="2" r="0.1" fill="#2980b9"/>
                            <path d="M 0.5 0 A 0.5 0.5 0 0 1 0.43 0.25" stroke="red" fill="none" stroke-width="0.05"/>
                            <text x="3.6" y="2.2" font-size="0.4">z</text>
                            <text x="0.6" y="0.3" font-size="0.3">π/6</text>
                        </svg>
                        <div class="diagram-caption">تمثيل العدد في مستوى آرغان</div>
                    </div>
                    <div class="final-result">الإجابة: $\\frac{1}{32} - i\\frac{\\sqrt{3}}{32}$</div>
                `
            },
            // Q5-B: Verify Solution
            {
                id: "5B", header: "السؤال الخامس / ب",
                question: "إثبت أن: $y = x \\ln|x| - x$ أحد حلول المعادلة: $x \\frac{dy}{dx} = x+y$ ، $x > 0$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الإثبات:</h3>
                        <p>نوجد المشتقة $\\frac{dy}{dx}$ للدالة المعطاة:</p>
                        $$ y = x \\ln x - x \quad (x>0) $$
                        $$ \\frac{dy}{dx} = (1 \\cdot \\ln x + x \\cdot \\frac{1}{x}) - 1 = \\ln x + 1 - 1 = \\ln x $$
                        <p>نعوض بقيمة $y$ و $\\frac{dy}{dx}$ في طرفي المعادلة التفاضلية:</p>
                        <p><strong>الطرف الأيسر:</strong></p>
                        $$ x \\frac{dy}{dx} = x(\\ln x) = x \\ln x $$
                        <p><strong>الطرف الأيمن:</strong></p>
                        $$ x + y = x + (x \\ln x - x) = x \\ln x $$
                        <p>بما أن الطرف الأيسر = الطرف الأيمن، فإن الدالة حل للمعادلة.</p>
                    </div>
                    <div class="final-result">تم الإثبات</div>
                `
            },
            // Q5-C: No Local Max
            {
                id: "5C", header: "السؤال الخامس / ج",
                question: "لتكن: $f(x) = x^2 + \\frac{a}{x}$ ، $a \\in R$ ، $x \\neq 0$، بيّن أن الدالة $f$ لا تمتلك نقطة نهاية عظمى محلية.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نوجد النقاط الحرجة بالمشتقة الأولى:</p>
                        $$ f'(x) = 2x - \\frac{a}{x^2} = \\frac{2x^3 - a}{x^2} $$
                        <p>$f'(x) = 0 \\Rightarrow 2x^3 = a \\Rightarrow x = \\sqrt[3]{\\frac{a}{2}}$.</p>
                        <p>نختبر نوع النقطة باستخدام المشتقة الثانية:</p>
                        $$ f''(x) = 2 - (-2)ax^{-3} = 2 + \\frac{2a}{x^3} $$
                        <p>عند النقطة الحرجة $x^3 = \\frac{a}{2}$:</p>
                        $$ f''(\\sqrt[3]{\\frac{a}{2}}) = 2 + \\frac{2a}{a/2} = 2 + 4 = 6 $$
                        <p>بما أن $f''(c) = 6 > 0$ دائماً (موجبة قطعاً)، فإن أي نقطة حرجة هي <strong>نهاية صغرى محلية</strong>.</p>
                        <p>وبالتالي لا توجد أي نقطة تكون فيها المشتقة الثانية سالبة، مما يعني عدم وجود نهاية عظمى محلية.</p>
                    </div>
                    <div class="final-result">الإجابة: الدالة ليس لها نهاية عظمى محلية</div>
                `
            },
            // Q6-A: Hyperbola & Parabola
            {
                id: "6A", header: "السؤال السادس / أ",
                question: "قطع زائد مركزه نقطة الأصل، والقيمة المطلقة لفرق بعدي أي نقطة عن بؤرتيه تساوي $(6)$ وحدات، وإحدى بؤرتيه هي بؤرة القطع المكافئ الذي رأسه نقطة الأصل ويمر بالنقطتين $(-1, 2\\sqrt{5})$ ، $(-1, -2\\sqrt{5})$، جد معادلتي كلاّ من القطع المكافئ والقطع الزائد.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p><strong>أولاً: معادلة القطع المكافئ</strong></p>
                        <p>رأسه الأصل ويمر بـ $(-1, 2\\sqrt{5})$. بما أن الإحداثي السيني سالب والصادي موجب وسالب، فهو قطع مفتوح لليسار:</p>
                        $$ y^2 = -4px \quad (p>0) $$
                        <p>نعوض بالنقطة:</p>
                        $$ (2\\sqrt{5})^2 = -4p(-1) \\Rightarrow 20 = 4p \\Rightarrow p = 5 $$
                        <p>المعادلة: $y^2 = -20x$. البؤرة: $(-5, 0)$.</p>
                        
                        <p><strong>ثانياً: معادلة القطع الزائد</strong></p>
                        <p>بؤرته هي بؤرة القطع المكافئ $\\Rightarrow c = 5$.</p>
                        <p>الفرق الثابت للمسافات $= 2a = 6 \\Rightarrow a = 3$.</p>
                        <p>نجد $b^2$:</p>
                        $$ b^2 = c^2 - a^2 = 25 - 9 = 16 $$
                        <p>بما أن البؤرة على محور السينات، فالمعادلة أفقية:</p>
                        $$ \\frac{x^2}{a^2} - \\frac{y^2}{b^2} = 1 $$
                    </div>
                    <div class="diagram-box">
                        <svg width="300" height="200" viewBox="-10 -8 12 16">
                            <path d="M -10 10 Q -5 0 -10 -10" stroke="#e74c3c" fill="none" stroke-width="0.1"/>
                            <path d="M -3 -8 Q 0 0 -3 8" stroke="#2980b9" fill="none" stroke-width="0.1"/>
                            <path d="M 3 -8 Q 0 0 3 8" stroke="#2980b9" fill="none" stroke-width="0.1"/>
                            <circle cx="-5" cy="0" r="0.2" fill="black"/>
                            <text x="-4.8" y="0.5" font-size="0.6">F(-5,0)</text>
                            <line x1="-10" y1="0" x2="10" y2="0" stroke="#333" stroke-width="0.05"/>
                            <line x1="0" y1="-8" x2="0" y2="8" stroke="#333" stroke-width="0.05"/>
                        </svg>
                        <div class="diagram-caption">القطع المكافئ (أحمر) والقطع الزائد (أزرق) يشتركان في البؤرة</div>
                    </div>
                    <div class="final-result">القطع المكافئ: $y^2 = -20x$ <br> القطع الزائد: $\\frac{x^2}{9} - \\frac{y^2}{16} = 1$</div>
                `
            },
            // Q6-B: Inverse Function
            {
                id: "6B", header: "السؤال السادس / ب",
                question: "إثبت فيما إذا كانت $F: [1, 3] \\longrightarrow R$ ، $F(x) = x^3 + 2$ هي دالة مقابلة للدالة $f(x) = 3x^2$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>الدالة $F(x)$ تعتبر دالة أصلية (Antiderivative) للدالة $f(x)$ إذا كانت $F'(x) = f(x)$.</p>
                        <p>نشتق $F(x)$:</p>
                        $$ F'(x) = \\frac{d}{dx}(x^3 + 2) = 3x^2 $$
                        <p>نلاحظ أن $F'(x) = f(x)$ لكل $x \\in [1, 3]$.</p>
                        <p>وبما أن $F$ قابلة للاشتقاق ومستمرة على الفترة، فهي بالفعل الدالة الأصلية المقابلة لـ $f$.</p>
                        <p><em>(ملاحظة: السؤال يستخدم مصطلح "دالة مقابلة" بمعنى الدالة الأصلية/التكاملية وليس الدالة العكسية Inverse Function، وذلك لأن مشتقة $x^3+2$ تساوي $3x^2$).</em></p>
                    </div>
                    <div class="final-result">الإجابة: نعم، لأنها تحقق $F'(x) = f(x)$</div>
                `
            },
            // Q6-C: Mean Value Theorem
            {
                id: "6C", header: "السؤال السادس / ج",
                question: "إذا كانت $f: [0, b] \\longrightarrow R$ حيث $f(x) = x^3 - 4x^2$ وكانت $f$ تحقق مبرهنة القيمة المتوسطة عند $c = \\frac{2}{3}$، جد $b$.",
                solution: `
                    <div class="step">
                        <h3>خطوات الحل:</h3>
                        <p>نحسب المشتقة عند $c = \\frac{2}{3}$:</p>
                        $$ f'(x) = 3x^2 - 8x $$
                        $$ f'(\\frac{2}{3}) = 3(\\frac{4}{9}) - 8(\\frac{2}{3}) = \\frac{4}{3} - \\frac{16}{3} = -\\frac{12}{3} = -4 $$
                        <p>حسب مبرهنة القيمة المتوسطة:</p>
                        $$ f'(c) = \\frac{f(b) - f(a)}{b - a} $$
                        <p>حيث $a=0$:</p>
                        $$ -4 = \\frac{(b^3 - 4b^2) - (0)}{b - 0} $$
                        $$ -4 = \\frac{b^3 - 4b^2}{b} = b^2 - 4b $$
                        $$ b^2 - 4b + 4 = 0 $$
                        $$ (b-2)^2 = 0 \\Rightarrow b = 2 $$
                    </div>
                    <div class="final-result">الإجابة: $b = 2$</div>
                `
            }
        ];

        // Render Grid
        const grid = document.getElementById('questionGrid');
        examData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => openAnswer(item.id);
            card.innerHTML = `
                <div>
                    <div class="q-header">${item.header}</div>
                    <div class="q-body">${item.question}</div>
                </div>
                <div class="hint">اضغط لعرض الحل الكامل ➜</div>
            `;
            grid.appendChild(card);
        });

        // Open Answer
        function openAnswer(id) {
            const item = examData.find(q => q.id === id);
            if (item) {
                const content = document.getElementById('answerContent');
                content.innerHTML = `
                    <h2 style="color: #2c3e50; border-bottom: 2px solid #2980b9; padding-bottom: 15px;">${item.header}</h2>
                    <div style="background: #eef2f3; padding: 20px; border-radius: 8px; margin-bottom: 30px; font-size: 1.2rem; font-weight: bold;">
                        ${item.question}
                    </div>
                    ${item.solution}
                `;
                document.getElementById('answerOverlay').classList.add('active');
                
                // Trigger MathJax to render new content
                if (window.MathJax) {
                    MathJax.typesetPromise();
                }
            }
        }

        // Close Answer
        function closeAnswer() {
            document.getElementById('answerOverlay').classList.remove('active');
        }

        // Escape Key Listener
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") {
                closeAnswer();
            }
        });
    </script>
